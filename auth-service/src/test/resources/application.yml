eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:stayfinder_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

stayfinder:
  auth:
    seed-demo-users: false
  jwt:
    issuer: stayfinder-auth
    ttl: 1h
