# StayFinder full stack. There is no Config Server — env vars below are the config.
#
#   ./scripts/compose-up.sh
#   docker compose down
#   docker compose down -v   # also wipe MySQL volume
#
# Mutually exclusive with docker-compose.kafka.yml (both publish 9092).
# Host MySQL stays on 3306; Compose MySQL is published on 3307.
#
# localhost inside a container is THAT container. Eureka, JWKS, Kafka, and
# MySQL must use Docker DNS names (eureka-server, auth-service, kafka, mysql).

name: stayfinder

x-spring-health: &spring-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 90s

x-spring-env: &spring-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
  TZ: UTC

services:
  mysql:
    image: mysql:8.4
    container_name: stayfinder-mysql
    ports:
      - "${MYSQL_PUBLISH_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-stayfinder}
    volumes:
      - stayfinder-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-stayfinder}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: stayfinder-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = Docker network (kafka:29092).
      # PLAINTEXT_HOST = laptop (localhost:9092).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: eureka-server/target/eureka-server-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-eureka
    ports:
      - "8761:8761"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]

  auth-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: auth-service/target/auth-service-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-auth
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: auth-service
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stayfinder}
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: booking-service/target/booking-service-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-booking
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: booking-service
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stayfinder}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STAYFINDER_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  food-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: food-service/target/food-service-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-food
    ports:
      - "8083:8083"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: food-service
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stayfinder}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STAYFINDER_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
      # OPEN circuit is a degraded Booking dependency, not a dead Food process.
      MANAGEMENT_HEALTH_CIRCUITBREAKERS_ENABLED: "false"
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: notification-service/target/notification-service-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-notification
    ports:
      - "8084:8084"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        JAR_FILE: api-gateway/target/api-gateway-0.0.1-SNAPSHOT.jar
    container_name: stayfinder-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      STAYFINDER_JWK_SET_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
    healthcheck:
      <<: *spring-health
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      food-service:
        condition: service_healthy

volumes:
  stayfinder-mysql:
